site_name: Django Log Lens
site_description: A dependency-free Django app providing a web interface for the log files written by Django's logging module.
site_url: https://martinbroede.github.io/django-log-lens/
repo_url: https://github.com/martinbroede/django-log-lens
repo_name: martinbroede/django-log-lens
edit_uri: ""

strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer


nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Client Logging: client-logging.md
  - FAQ: faq.md
  - Coverage Report: https://martinbroede.github.io/django-log-lens/coverage/
