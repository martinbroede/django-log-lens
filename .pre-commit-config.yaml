repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-case-conflict

  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
        args: ['--max-line-length=120']

      - id: isort
        name: isort
        entry: isort
        language: system
        types: [python]
        args: ['--profile=django']

      - id: autopep8
        name: autopep8
        entry: autopep8
        language: system
        types: [python]
        args: ['--max-line-length=120', '--in-place']

      - id: djlint
        name: djlint
        entry: djlint
        language: system
        types: [html]

      - id: bandit
        name: bandit
        entry: bandit
        language: system
        types: [python]
        args: ['-r', 'django_log_lens']
        stages: [manual]

      - id: tests
        name: tests
        entry: python demo/manage.py test demo.test
        language: system
        pass_filenames: false
        always_run: true

      - id: minify-js
        name: minify JS
        entry: bash -c './scripts/minify.sh -s "./django_log_lens/static/django_log_lens/dev" -f "alpinejs.v3.vendor.js notifications.js init.js main.js formatter.js util.js navigation.js search.js" -d "./django_log_lens/static/django_log_lens/main.generated.js" && git add django_log_lens/static/django_log_lens/main.generated.js'
        language: system
        files: ^django_log_lens/static/django_log_lens/dev/(alpinejs|notifications|init|main|formatter|util|navigation|search)\.js$
        pass_filenames: false

      - id: minify-css
        name: minify CSS
        entry: bash -c './scripts/minify.sh -s "./django_log_lens/static/django_log_lens/dev" -f "pico.v2.vendor.css styles.css" -d "./django_log_lens/static/django_log_lens/styles.generated.css" && git add django_log_lens/static/django_log_lens/styles.generated.css'
        language: system
        files: ^django_log_lens/static/django_log_lens/dev/(pico|styles)\.css$
        pass_filenames: false
